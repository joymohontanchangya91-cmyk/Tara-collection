
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tara Collection | Fashion Store</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
      background: #f8f7f4;
    }

    header {
      background: #182b25;
      color: white;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 16px;
    }

    .hero {
      text-align: center;
      padding: 75px 20px;
      background: #e6e9df;
    }

    .hero h2 {
      font-size: 38px;
      margin: 0 0 15px;
    }

    .hero p {
      color: #555;
    }

    .shop-button {
      display: inline-block;
      background: #182b25;
      color: white;
      padding: 13px 24px;
      margin-top: 12px;
      text-decoration: none;
      border-radius: 5px;
    }

    .products {
      padding: 40px 7%;
    }

    .products h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 22px;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 10px #00000010;
    }

    .product img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 5px;
    }

    .product button {
      background: #182b25;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 5px;
      cursor: pointer;
    }

    .product button:hover,
    .shop-button:hover {
      background: #345548;
    }

    footer {
      text-align: center;
      background: #182b25;
      color: white;
      padding: 25px;
      margin-top: 25px;
    }

    @media (max-width: 500px) {
      header {
        padding: 18px;
      }

      nav a {
        margin-left: 0;
        margin-right: 12px;
      }

      .hero h2 {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Tara Collection</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#contact">Contact</a>
      <a href="#products">Cart (<span id="cart">0</span>)</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h2>Discover Your Style</h2>
    <p>Fashion for Everyone. Find your perfect look.</p>
    <a class="shop-button" href="#products">Shop Now</a>
  </section>

  <section class="products" id="products">
    <h2>Our Products</h2>

    <div class="product-grid">
      <article class="product">
        <img src="https://placehold.co/400x450/e8e0d5/333?text=Classic+Shirt"
             alt="Classic shirt">
        <h3>Classic Shirt</h3>
        <p>৳850</p>
        <button onclick="addToCart()">Add to Cart</button>
      </article>

      <article class="product">
        <img src="https://placehold.co/400x450/d9e1e8/333?text=Casual+T-Shirt"
             alt="Casual T-shirt">
        <h3>Casual T-Shirt</h3>
        <p>৳550</p>
        <button onclick="addToCart()">Add to Cart</button>
      </article>

      <article class="product">
        <img src="https://placehold.co/400x450/e4d9df/333?text=Fashion+Dress"
             alt="Fashion dress">
        <h3>Fashion Dress</h3>
        <p>৳1,200</p>
        <button onclick="addToCart()">Add to Cart</button>
      </article>
    </div>
  </section>

  <footer id="contact">
    <h3>Tara Collection</h3>
    <p>Contact us to learn more about our products.</p>
    <p>© 2026 Tara Collection</p>
  </footer>

  <script>
    let cartCount = 0;

    function addToCart() {
      cartCount++;
      document.getElementById("cart").textContent = cartCount;
      alert("Product added to cart!");
    }
  </script>
</body>
</html>
